version: '3.8'

# NOTE: This docker-compose file must be run from the repository root directory

services:
  ros2-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-oriented-comms-robot:latest
    container_name: turtlebot-simulation
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=waffle_pi
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount src directory for live code changes
      - ./src:/root/workspace/src:rw
      # Mount /dev/input for joystick access
      - /dev/input:/dev/input:ro
    devices:
      # Grant access to input devices for joystick
      - /dev/input:/dev/input
    network_mode: host
    stdin_open: true
    tty: true
    command: bash
