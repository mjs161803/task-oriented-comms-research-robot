version: '3.8'

services:
  ros2-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-oriented-comms-robot:latest
    container_name: turtlebot-simulation
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=burger
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/root/workspace/src:rw
    network_mode: host
    stdin_open: true
    tty: true
    command: bash
